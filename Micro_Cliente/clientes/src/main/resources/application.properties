server.port=8083

# 1. FORÇA O SPRING A CONECTAR AO SEU MYSQL LOCAL
spring.datasource.url=jdbc:mysql://localhost:3306/db_clientes?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
# (MUDE 'root' ACIMA PARA A SUA SENHA REAL DO MYSQL WORKBENCH)

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. FORÇA A CRIAÇÃO DAS TABELAS
spring.jpa.hibernate.ddl-auto=update

# 3. O DETETIVE: OBRIGA A MOSTRAR OS INSERTS NO TERMINAL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true